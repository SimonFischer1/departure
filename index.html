<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiedersehen – Simon kommt nach Hause</title>
<meta name="theme-color" content="#E9EEF0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="cover" aria-hidden="true"><span>Wiedersehen</span></div>

<header class="bar">
  <span class="brand">Wiedersehen</span>
  <span class="live" id="status"></span>
</header>

<main>
  <section class="hero">
    <p class="kicker r" style="--d:.9s">Noch</p>
    <h1 class="r" style="--d:1s"><span id="cd">0</span><small>Tage</small></h1>
    <p class="lead r" style="--d:1.15s" id="title">Simon kommt nach Hause.</p>
    <dl class="units r" style="--d:1.3s">
      <div><dt>Stunden</dt><dd id="ch">0</dd></div>
      <div><dt>Minuten</dt><dd id="cm">00</dd></div>
      <div><dt>Sekunden</dt><dd id="cs">00</dd></div>
    </dl>
    <p class="when r" style="--d:1.4s" id="when"></p>
  </section>

  <section class="route reveal">
    <div class="head">
      <h2>Die Reise</h2>
      <p class="pct"><span id="pct">0</span><small>%</small></p>
    </div>
    <div class="sea">
      <div class="rail"><i id="fill"></i></div>
      <div class="fig ship" id="shipFig"><img id="mint" src="assets/mint-fuggler.png" alt="Simon unterwegs"></div>
      <div class="fig home"><img id="purple" src="assets/purple-fuggler.png" alt="Zuhause wartet"></div>
    </div>
    <ul class="marks" id="marks"></ul>
  </section>

  <section class="day">
    <div class="head reveal">
      <h2>Der Tag der Heimreise</h2>
      <p id="dayDate"></p>
    </div>
    <ol class="steps" id="steps"><li class="spine"><i id="spineFill"></i></li></ol>
  </section>

  <section class="cta reveal">
    <button id="calendarBtn" type="button">In Kalender eintragen</button>
    <a id="mapBtn" target="_blank" rel="noopener">Ankunftsort öffnen</a>
  </section>
</main>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
