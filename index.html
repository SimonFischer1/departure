<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon kommt nach Hause</title>
<meta name="theme-color" content="#071628">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="hero">
    <p class="status" id="status"></p>
    <h1 id="title">Simon kommt nach Hause</h1>
    <div class="count" id="count" aria-live="off">
      <div><b id="cd">0</b><span>Tage</span></div>
      <div><b id="ch">0</b><span>Stunden</span></div>
      <div><b id="cm">0</b><span>Minuten</span></div>
      <div><b id="cs">0</b><span>Sekunden</span></div>
    </div>
    <p class="when" id="when"></p>
  </header>

  <section class="route" aria-label="Fortschritt der Reise">
    <div class="sea">
      <div class="line"></div>
      <div class="done" id="progress"></div>
      <div class="fig ship" id="shipFig"><img id="mint" src="assets/mint-fuggler.png" alt="Simon unterwegs"></div>
      <div class="fig home"><img id="purple" src="assets/purple-fuggler.png" alt="Zuhause wartet"></div>
    </div>
    <div class="ends"><span id="fromLbl"></span><span id="pctLbl"></span><span id="toLbl"></span></div>
  </section>

  <div class="actions">
    <button id="calendarBtn" type="button">In Kalender eintragen</button>
    <a id="mapBtn" target="_blank" rel="noopener">Ankunftsort öffnen</a>
  </div>

  <section class="log">
    <h2>Logbuch</h2>
    <ol id="timeline"></ol>
  </section>
</main>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
