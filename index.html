<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon kommt nach Hause</title>
<meta name="description" content="Countdown, Timeline und Kalender für das Wiedersehen.">
<meta name="theme-color" content="#07111E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scrollbar" id="scrollbar" aria-hidden="true"></div>

<header class="nav">
  <a class="brand" href="#top">Wiedersehen</a>
  <nav aria-label="Abschnitte"><a href="#timeline">Timeline</a><a href="#kalender">Kalender</a></nav>
</header>

<main id="top">
  <section class="hero" aria-labelledby="h-count">
    <p class="kicker r" style="--d:.1s" id="status"></p>
    <h1 id="h-count" class="r" style="--d:.25s"><small class="pre">Noch</small><span id="cd">–</span><small id="unit">Tage</small></h1>
    <p class="lead r" style="--d:.45s" id="title">bis Simon nach Hause kommt.</p>
    <div class="progress r" style="--d:.6s">
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="pbar"><i id="pfill"></i></div>
      <div class="pmeta"><span id="pFrom"></span><b id="pPct"></b><span id="pTo"></span></div>
    </div>
    <a class="down r" style="--d:.8s" href="#timeline" aria-label="Zur Timeline">Zur Timeline<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M2 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
  </section>

  <section class="block" id="timeline" aria-labelledby="h-tl">
    <div class="head reveal"><h2 id="h-tl">Timeline</h2><p>Von der Abreise bis zum Wiedersehen.</p></div>
    <ol class="tl" id="tl"><li class="spine" aria-hidden="true"><i id="spineFill"></i></li></ol>
  </section>

  <section class="block" id="kalender" aria-labelledby="h-cal">
    <div class="head reveal"><h2 id="h-cal">Kalender</h2><p id="calSub"></p></div>
    <div class="cal reveal">
      <aside class="card">
        <p class="cl">Wann</p><p class="cv" id="cWhen"></p>
        <p class="cl">Wo</p><p class="cv" id="cWhere"></p>
        <div class="acts">
          <button type="button" id="icsBtn" class="primary">Zum Kalender hinzufügen</button>
          <a id="mapBtn" target="_blank" rel="noopener">In Apple Karten öffnen</a>
        </div>
      </aside>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
