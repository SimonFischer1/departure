<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heimkehr">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Departure</title>
<link rel="stylesheet" href="style.css?v=20261121">
</head>
<body>
<main class="wrap">

<section class="scan" aria-labelledby="titel">
  <p class="ship"><i class="dot"></i><span id="schiff"></span></p>
  <h1 id="titel"></h1>
  <p class="lead" id="untertitel"></p>

  <div class="radar" id="radar">
    <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
    <div class="sprite blink" id="sprite" role="img" aria-label="Pixel-Maske, die blinkt"></div>
  </div>

  <div class="fl" id="fl" hidden>
    <svg id="fsvg" viewBox="0 0 640 270" class="air" role="img" aria-label="Flugstatus als Grafik">
      <defs><linearGradient id="fg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a0d12"/><stop offset="1" stop-color="#050203"/></linearGradient></defs>
      <rect width="640" height="270" fill="url(#fg)"/>
      <g fill="none" stroke="rgba(255,255,255,.08)"><path d="M0 0L300 180M0 0L220 250M0 0L120 270M0 0L420 90M0 0L520 20M60 22Q80 70 40 110M120 44Q150 110 80 170M190 70Q230 150 130 230M270 100Q320 170 230 250"/><path d="M640 0L420 150M640 0L520 230M640 0L330 40M640 0L590 270M580 18Q560 60 600 100M520 36Q490 100 560 160M450 62Q410 130 500 215"/></g>
      <rect class="cloud" y="40" width="110" height="14" rx="7"/><rect class="cloud c2" y="82" width="70" height="10" rx="5"/><rect class="cloud c3" y="130" width="150" height="16" rx="8"/>
      <rect y="222" width="640" height="48" fill="#0c0506"/><rect y="222" width="640" height="2" fill="#ff453a" opacity=".6"/>
      <path d="M0 246H640" stroke="#f5f5f7" opacity=".25" stroke-width="3" stroke-dasharray="22 18"/>
      <g fill="#1d0b0e"><rect x="40" y="170" width="70" height="52"/><rect x="66" y="140" width="18" height="30"/><rect x="530" y="170" width="70" height="52"/><rect x="556" y="140" width="18" height="30"/></g>
      <text id="fcl" x="75" y="202" text-anchor="middle" fill="#ff453a" font-size="16" font-weight="800"></text>
      <text id="fcr" x="565" y="202" text-anchor="middle" fill="#ff453a" font-size="16" font-weight="800"></text>
      <g id="fplane" style="transform:translate(180px,192px)"><g class="pin"><g id="fpx" shape-rendering="crispEdges"></g></g></g>
    </svg>
    <div class="fread" aria-live="polite">
      <div class="fstate" id="fstate"></div>
      <div class="fclock" id="fclock"></div>
      <p class="fsub" id="fsub"></p>
      <div class="froute">
        <div><b id="fvc"></b><span id="fvo"></span><em id="fvt"></em></div>
        <div class="fmid"><strong id="fnr"></strong><span id="fdur"></span></div>
        <div class="r"><b id="fnc"></b><span id="fno"></span><em id="fnt"></em></div>
      </div>
      <div class="ftrack"><i id="ffill"></i></div>
    </div>
  </div>

  <div class="read" id="read" aria-live="polite">
    <div class="count"><span class="num" id="tage">–</span><span class="unit" id="zaehlerText"></span></div>
    <div class="bars" id="bars" aria-hidden="true"></div>
    <p class="status" id="status"></p>
    <p class="rate" id="rate"></p>
  </div>
</section>

<section class="test" id="testsec">
  <div class="testhead"><h2>Signal testen</h2><span class="pill" id="pill" hidden>Vorschau</span></div>
  <p class="sub">Zieh den Regler und sieh, wie das Blinken schneller wird.</p>
  <input type="range" id="slider" min="0" max="100" value="0" step="1" aria-label="Abstand simulieren">
  <div class="ends"><span>Abreise</span><span>Ankunft</span></div>
  <button class="btn" id="live" type="button" hidden>Echten Stand zeigen</button>
</section>

<section class="track-sec">
  <h2>Die Route</h2>
  <div class="track" id="track"></div>
</section>

<section>
  <div class="head"><h2>Reiseverlauf</h2><button class="btn" id="heute" type="button">Zu heute</button></div>
  <ol class="route" id="route"></ol>
</section>

<footer class="foot">Orte, Daten und Texte stehen in <b>config.js</b>.</footer>
</main>
<script src="config.js?v=20261121"></script>
<script src="script.js?v=20261121"></script>
</body>
</html>
