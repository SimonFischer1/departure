<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>Departure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a14;--panel:#0a1424;--blue:#1688ff;--blue2:#5aa9ff;--ice:#d6e6ff;--mute:#8ea3bd;--hull:#ff6a2b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;color:var(--ice);font:400 16px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(60rem 30rem at 50% -5%,rgba(22,136,255,.16),transparent),var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
/* Rahmen mit Eckwinkeln */
.frame{position:relative;border:1px solid rgba(22,136,255,.4);background:linear-gradient(160deg,rgba(14,28,50,.9),rgba(6,12,22,.95))}
.frame:before,.frame:after{content:"";position:absolute;width:20px;height:20px;border:3px solid var(--blue);pointer-events:none}
.frame:before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.frame:after{bottom:-2px;right:-2px;border-left:0;border-top:0}
/* Hero */
.hero{display:grid;gap:26px;padding:18px 0 10px}
.photo{aspect-ratio:16/10;overflow:hidden;margin:0}
.photo img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.05)}
.photo:before,.photo:after{z-index:2}
.photo .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(5,10,20,.85))}
.photo .tag{position:absolute;left:16px;bottom:30px;z-index:1;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.photo .tag i{width:9px;height:9px;border-radius:50%;background:var(--hull);box-shadow:0 0 0 4px rgba(255,106,43,.25)}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:26px;z-index:1}
.wave path{fill:var(--bg)}
.wave path+path{fill:none;stroke:var(--blue);stroke-width:1.5;opacity:.7}
h1{margin:0 0 10px;font-size:clamp(40px,9vw,68px);line-height:.95;font-weight:800;font-stretch:75%;letter-spacing:-.01em}
.lead{margin:0;max-width:40ch;color:var(--mute)}
.gauge{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:8px auto 0}
.gauge svg{width:100%;height:100%;display:block}
.gauge .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.num{font-size:clamp(76px,22vw,96px);line-height:.85;font-weight:900;font-stretch:62%;font-variant-numeric:tabular-nums;color:#fff}
.unit{margin-top:8px;font-size:13px;font-weight:600;color:var(--blue2);max-width:12ch;line-height:1.25}
.meta{text-align:center;margin:6px 0 0;font-size:14px;color:var(--mute)}
/* Karte */
section{padding:38px 0 0}
h2{margin:0 0 6px;font-size:clamp(30px,6vw,42px);line-height:1;font-weight:800;font-stretch:75%}
.sub{margin:0 0 20px;color:var(--mute)}
.chart{padding:6px;margin-top:4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--ice)}
.chart .d{fill:var(--mute);font-size:9px}
.chart .k{font-size:11.5px;font-weight:700}
/* Verlauf */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}
.btn{border:1px solid rgba(22,136,255,.5);background:rgba(22,136,255,.1);color:var(--ice);border-radius:99px;padding:8px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:rgba(22,136,255,.28)}
.btn:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
.route{list-style:none;margin:0;padding:6px 0 0;position:relative}
.item{position:relative;display:grid;grid-template-columns:48px 1fr;gap:14px;padding-bottom:20px}
.item:last-child{padding-bottom:0}
.item:before{content:"";position:absolute;left:23px;top:48px;bottom:-4px;width:2px;background:repeating-linear-gradient(180deg,rgba(90,169,255,.4) 0 6px,transparent 6px 11px)}
.item.past:before{background:var(--blue)}
.item:last-child:before{display:none}
.node{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid rgba(90,169,255,.45);color:var(--blue2);position:relative;z-index:1}
.node svg{width:22px;height:22px;fill:currentColor}
.node svg.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.past .node{background:var(--blue);border-color:var(--blue);color:#fff}
.now .node{background:var(--hull);border-color:var(--hull);color:#fff;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,106,43,.55)}70%,100%{box-shadow:0 0 0 14px rgba(255,106,43,0)}}
.card{border-radius:18px;padding:16px 44px 16px 18px;position:relative;border:1px solid rgba(22,136,255,.35);background:linear-gradient(150deg,rgba(14,28,50,.9),rgba(6,12,22,.95))}
.card:after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--mute)}
.now .card{border-color:var(--hull);box-shadow:0 0 28px rgba(255,106,43,.14)}
.date{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;color:var(--blue2);border:1px solid rgba(22,136,255,.5);border-radius:99px;padding:0 9px}
.now .badge{color:var(--hull);border-color:var(--hull)}
.card h3{margin:4px 0 4px;font-size:21px;line-height:1.2;font-weight:700;color:#fff}
.card p{margin:0;color:#a9b9cf;font-size:14px;max-width:48ch}
.card .ort{margin-top:10px;font-size:13px;color:var(--blue2);display:flex;gap:6px;align-items:center}
.card .ort svg{width:14px;height:14px;fill:currentColor}
.foot{padding:40px 0 36px;font-size:13px;color:var(--mute)}
@media(min-width:860px){
 .hero{grid-template-columns:1fr 1fr;align-items:center;gap:56px;padding-top:44px}
 .photo{order:2;aspect-ratio:4/3}.txt{order:1}
 .gauge{margin:20px 0 0}.meta{text-align:left;margin-top:12px}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
 section{padding-top:56px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script>
(()=>{
const C=window.REISE,$=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

const n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
const diff=(a,b)=>Math.round((b-a)/864e5);

let status=C.vorStart;
stops.forEach(s=>{if(s.d<=today)status=s.status||status;if(+s.d===+today&&s.heute)status=s.heute});
$("status").textContent=status;

const left=Math.max(0,diff(today,last)),total=diff(first,last);
const done=Math.min(total,Math.max(0,diff(first,today))),pct=total?done/total:0;

/* Skalenring */
const T=72,ticks=$("ticks");

const pos=stops.map((_,i)=>N>1?L*i/(N-1):0);
let dist=0;
if(today>=last)dist=L;else if(today>first){for(let i=0;i<N-1;i++)if(stops[i].d<=today&&today<stops[i+1].d){dist=pos[i]+(pos[i+1]-pos[i])*diff(stops[i].d,today)/Math.max(1,diff(stops[i].d,stops[i+1].d));break}}
$("rd").setAttribute("stroke-dasharray",`${dist} ${L}`);
stops.forEach((s,i)=>{const p=at(pos[i]),past=pos[i]<=dist,up=i%2===1,anchor=i===0?"start":i===N-1?"end":"middle",lx=i===0?p.x-14:i===N-1?p.x+14:p.x;
 $("pts").append(sv("circle",{cx:p.x,cy:p.y,r:7,fill:past?"#1688ff":"#0a1424",stroke:past?"#1688ff":"#5aa9ff","stroke-width":2.5}));
 $("pts").append(sv("text",{x:lx,y:p.y+(up?-22:30),"text-anchor":anchor,class:"k"},s.kurz||s.titel));
 $("pts").append(sv("text",{x:lx,y:p.y+(up?-11:41),"text-anchor":anchor,class:"d"},fmt(s.d,{day:"2-digit",month:"2-digit",year:"numeric"})))});
const sp=at(dist),sq=at(dist+2),sr=at(dist-2),ang=Math.atan2(sq.y-sr.y,sq.x-sr.x)*180/Math.PI;
$("ship").setAttribute("transform",`translate(${sp.x} ${sp.y}) rotate(${ang})`);

/* Verlauf */
const ICON={
 flug:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
 schiff:'<svg class="s" viewBox="0 0 24 24"><path d="M3 14l2 6h14l2-6zM6 14V9h12v5M9 9V5h6v4"/></svg>',
 flagge:'<svg class="s" viewBox="0 0 24 24"><path d="M6 21V3M6 4h12l-3 4 3 4H6"/></svg>',
 punkt:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>'};
const PIN='<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.500a2.5 2.5 0 0 1 0 5z"/></svg>';
const entries=[];let marked=today<=first||today>last||stops.some(s=>+s.d===+today);
stops.forEach(s=>{if(!marked&&s.d>today){entries.push({d:today,icon:"punkt",titel:"Heute",text:status,marker:1});marked=true}entries.push(s)});
const route=$("route");
entries.forEach(s=>{
 const st=+s.d===+today?"now":s.d<today?"past":"future",li=el("li","item "+st);
 const node=el("div","node");node.innerHTML=ICON[s.icon]||ICON.punkt;
 const card=el("div","card"),date=el("div","date");
 date.append(el("span",null,fmt(s.d,{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})));
 if(s.badge)date.append(el("span","badge",s.badge));
 if(st==="now"&&!s.marker)date.append(el("span","badge","Heute"));
 card.append(date,el("h3",null,s.titel));
 if(s.text)card.append(el("p",null,s.text));
 if(s.ort){const o=el("div","ort");o.innerHTML=PIN;o.append(el("span",null,s.ort));card.append(o)}
 li.append(node,card);route.append(li)});
$("heute").onclick=()=>{const t=route.querySelector(".now")||route.querySelector(".future")||route.lastElementChild;t.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"})};
})();
</script>
</body>
