<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon kommt nach Hause</title>
<meta name="theme-color" content="#08121F">
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <span class="brand">Rotterdam → Bremen</span>
  <span class="live" id="status"></span>
</header>

<main>
  <section class="hero">
    <p class="kicker r" style="--d:.1s">Noch</p>
    <h1 class="r" style="--d:.25s"><span id="cd">–</span><small>Tage</small></h1>
    <p class="lead r" style="--d:.45s" id="title">Simon kommt nach Hause.</p>
    <p class="when r" style="--d:.6s" id="when"></p>
  </section>

  <section class="route">
    <div class="head reveal">
      <h2>Die Reise</h2>
      <p class="pct"><span id="pct">0</span><small>% geschafft</small></p>
    </div>
    <div class="map reveal">
      <svg viewBox="0 0 1000 400" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7CF0D0"/><stop offset="1" stop-color="#F3EEE4"/></linearGradient></defs>
        <path id="base" d="M110 300 Q500 -60 890 110" fill="none" stroke="rgba(243,238,228,.22)" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
        <path id="done" d="M110 300 Q500 -60 890 110" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="110" cy="300" r="9" fill="#7CF0D0"/>
        <circle cx="890" cy="110" r="9" fill="none" stroke="#F3EEE4" stroke-width="3"/>
        <circle id="ship" r="13" fill="#7CF0D0"/><circle id="halo" r="13" fill="none" stroke="#7CF0D0" stroke-width="2"/>
      </svg>
      <span class="city a">Rotterdam<em>Schiff</em></span>
      <span class="city b">Bremen<em>Zuhause</em></span>
    </div>
    <ol class="marks" id="marks"></ol>
  </section>

  <section class="day">
    <div class="head reveal">
      <h2>Der Tag der Heimreise</h2>
      <p id="dayDate"></p>
    </div>
    <ol class="steps" id="steps"><li class="spine"><i id="spineFill"></i></li></ol>
  </section>

  <section class="cta reveal">
    <button id="calendarBtn" type="button">In Kalender eintragen</button>
    <a id="mapBtn" target="_blank" rel="noopener">Ankunftsort öffnen</a>
  </section>
</main>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
